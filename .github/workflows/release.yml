name: Release CI

on:
  push:
    branches:
      - release

concurrency:
  group: release-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  detect-version-changed:
    uses: ./.github/workflows/_detect_version_changed_shared.yml
    permissions:
      contents: read
    secrets:
      BASETENBOT_GITHUB_TOKEN: ${{ secrets.BASETENBOT_GITHUB_TOKEN }}

  build-n-push-context-builder-image:
    needs: [detect-version-changed]
    if: ${{ !failure() && !cancelled() && needs.detect-version-changed.outputs.release_version == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0

      - name: Set up Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@6d415f71ab3ef9a7738ade671313ffac4ba9f06c # v3

      - name: Login to Docker Hub
        uses: chainguard-actions/docker-login-action@aefdd94d7a26b90dba6146f32d376ef273113621 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: chainguard-actions/docker-metadata-action@f00cce7d85a292451bbab8346cddfdfb3a7b0ea4 # v6.2.0
        with:
          images: baseten/truss-context-builder

      - name: Docker Build
        id: docker_build
        uses: chainguard-actions/docker-build-push-action@7a9792a1d0d1c43df643ef18b1f3a4a495833b23 # v7.4.0
        with:
          context: ./
          file: ./context_builder.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: baseten/truss-context-builder:v${{ needs.detect-version-changed.outputs.new_version }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  publish-release-to-pypi:
    needs: [detect-version-changed]
    if: ${{ !failure() && !cancelled() && needs.detect-version-changed.outputs.release_version == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - name: "Git tag release"
        uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0
        with:
          token: ${{secrets.BASETENBOT_GITHUB_TOKEN}}
      - run: |
          NEW_VERSION=v${{ needs.detect-version-changed.outputs.new_version }}
          git config --global user.name "Github action"
          git config --global user.email "github.action@baseten.co"

          git tag -a $NEW_VERSION -m "Release $NEW_VERSION"
          git push origin $NEW_VERSION

      - uses: ./.github/actions/setup-python/

      - name: Install packages
        run: uv sync

      - name: Build
        run: uv build

      - name: Create Release
        uses: chainguard-actions/ncipollo-release-action@28076a84406b6ec1cbcd5d2f918bec300ea1f891 # v1.21.0
        with:
          artifacts: "dist/*"
          token: ${{ secrets.BASETENBOT_GITHUB_TOKEN }}
          draft: false
          prerelease: ${{ needs.detect-version-changed.outputs.is_prerelease_version }}
          generateReleaseNotes: true
          makeLatest: true
          skipIfReleaseExists: true
          tag: "v${{ needs.detect-version-changed.outputs.new_version }}"

      - name: Publish package to PyPI (Trusted Publishing)
        if: ${{ github.event_name != 'pull_request' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          verbose: true
          print-hash: true
