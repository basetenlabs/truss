name: Verify Node build package installation

on:
  workflow_call:
    inputs:
      run_only_integration:
        type: boolean
        default: true
      store_durations_serially:
        type: boolean
        default: false

jobs:
  verify-node-apt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [lts-debian, lts-debian-aarch64]
    steps:
      - name: Install packages in the Node build image
        run: |
          docker run --rm --user 0:0 ghcr.io/napi-rs/napi-rs/nodejs-rust:${{ matrix.image }} bash -c '
            set -euo pipefail
            for apt_sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$apt_sources" ]; then
                sed -i -E \
                  -e "s#http://archive\.ubuntu\.com/ubuntu/*#https://azure.archive.ubuntu.com/ubuntu/#g" \
                  -e "s#http://security\.ubuntu\.com/ubuntu/*#https://security.ubuntu.com/ubuntu/#g" \
                  "$apt_sources"
              fi
            done
            apt-get update && apt-get install -y curl libssl-dev libatomic-ops-dev
            if ! perl -MIPC::Cmd -e 1 > /dev/null 2>&1; then
              apt-get install -y perl
            fi
            perl --version
          '
