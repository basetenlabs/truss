name: Reusable Integration Tests

on:
  workflow_call:
    inputs:
      run_only_integration:
        type: boolean
        required: false
        default: true
      store_durations_serially:
        type: boolean
        required: false
        default: false

env:
  # Pin test image builds to one reliable mirror; the default mirror list
  # (mirrors.ubuntu.com/US.txt) intermittently serves broken mirrors.
  BT_APT_MIRROR_URL: https://archive.ubuntu.com/ubuntu/

jobs:
  diagnose-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare Ubuntu package downloads
        run: |
          for ubuntu_repo_url in https://archive.ubuntu.com/ubuntu https://security.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            curl -L --max-time 20 --silent --show-error \
              "$ubuntu_repo_url/pool/main/p/perl/libperl5.34_5.34.0-3ubuntu1.10_amd64.deb" \
              -o /tmp/perl-probe -w "$ubuntu_repo_url %{http_code} %{size_download}\\n" || true
          done

  determine-python-versions:
    runs-on: ubuntu-22.04
    outputs:
      min_supported_python_version: ${{ steps.extract.outputs.min_supported_python_version }}
      max_supported_python_version: ${{ steps.extract.outputs.max_supported_python_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for version extraction
        run: pip install tomlkit packaging
      - name: Extract Python Version Range
        id: extract
        run: |
          python .github/scripts/get-python-version-range.py

  store-test-durations:
    if: ${{ inputs.store_durations_serially }}
    runs-on: ubuntu-22.04
    needs: determine-python-versions
    env:
      UV_PYTHON: ${{ needs.determine-python-versions.outputs.max_supported_python_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python/
        with:
          python-version: ${{ needs.determine-python-versions.outputs.max_supported_python_version }}
      - run: uv sync
      - name: Run all tests serially and store durations
        run: |
          uv run pytest truss/tests -m integration --store-durations --durations-path=test_durations.json
      - name: Save test durations to cache
        uses: actions/cache/save@v4
        with:
          path: test_durations.json
          key: integration-test-durations-v1


  truss-integration-tests:
    if: ${{ false }}
    needs: determine-python-versions
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python_version }}
    strategy:
      fail-fast: false
      matrix:
        python_version: [
          "${{ needs.determine-python-versions.outputs.min_supported_python_version }}",
          "${{ needs.determine-python-versions.outputs.max_supported_python_version }}"
        ]
        split_group: ["1"]
    steps:
      - uses: actions/checkout@v4
      # Shards build many multi-GB images and have hit buildkit "no space left
      # on device"; drop unused preinstalled toolchains to reclaim ~20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Restore test durations from cache
        uses: actions/cache/restore@v4
        with:
          path: test_durations.json
          key: integration-test-durations-v1
        continue-on-error: true
      # NB(nikhil): Pin Docker to v28, since integration tests newly break on v29.
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.5.2
      - uses: ./.github/actions/setup-python/
        with:
          python-version: ${{ matrix.python_version }}
      - run: |
          sudo mkdir -p /bptr && sudo chown $(whoami):$(whoami) /bptr
          sudo mkdir -p /static-bptr && sudo chown $(whoami):$(whoami) /static-bptr
          sudo mkdir -p /cache && sudo chown $(whoami):$(whoami) /cache
      - run: uv sync
      - name: Run Pytest
        run: |
          if [[ "${{ inputs.run_only_integration }}" == "true" ]]; then
            test_marker="-m integration"
          else
            test_marker=""
          fi

          uv run pytest $test_marker \
            truss/tests/templates/control/control/test_server_integration.py::test_truss_control_server_termination \
            truss/tests/templates/control/control/test_server_integration.py::test_truss_control_server_patch_ping_delays \
            truss/tests/test_model_inference.py::test_async_streaming_with_cancellation \
            truss/tests/test_model_inference.py::test_is_healthy_returns_503_on_load_failure \
            truss/tests/test_truss_handle.py::test_docker_predict_custom_base_image \
            'truss/tests/test_truss_handle.py::test_build_serving_docker_image_from_user_base_image_live_reload[baseten/truss-server-base:3.14-gpu-v0.13.0-/usr/bin/python3-False]' \
            --durations=20 \
            --junitxml=report-${{ matrix.python_version }}-${{ matrix.split_group }}.xml
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          report_paths: "report-${{ matrix.python_version }}-${{ matrix.split_group }}.xml"

  chains-integration-tests:
    if: ${{ false }}
    needs: determine-python-versions
    runs-on: ubuntu-22.04
    env:
      UV_PYTHON: ${{ matrix.python_version }}
    strategy:
      fail-fast: false
      matrix:
        python_version: [
          "${{ needs.determine-python-versions.outputs.min_supported_python_version }}",
          "${{ needs.determine-python-versions.outputs.max_supported_python_version }}"
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python/
        with:
          python-version: ${{ matrix.python_version }}
      - run: sudo mkdir -p /bptr && sudo chown $(whoami):$(whoami) /bptr
      - run: uv sync
      - name: Run Chains Tests
        run: |
          if [[ "${{ inputs.run_only_integration }}" == "true" ]]; then
            test_marker="-m integration"
          else
            test_marker=""
          fi

          uv run pytest truss-chains/tests \
            --durations=20 $test_marker \
            --junitxml=report-${{ matrix.python_version }}.xml \
            -s --log-cli-level=INFO
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          report_paths: "report-${{ matrix.python_version }}.xml"
