name: Test baseten-performance-client

on:
  push:
    branches:
      - main
      - master
    paths:
      - "baseten-performance-client/**"
      - ".github/workflows/**"
    tags:
      - "*"
  pull_request:
    paths:
      - "baseten-performance-client/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: baseten-performance-client/python_bindings

jobs:
  test-baseten-performance-client:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@31bbccf724702f8a0dc7a3ed7db8fcca2066babc # v4.4.0
      - uses: chainguard-actions/actions-setup-python@ace3254bb5011efbd0650a7120a0441ebd1f9400 # v5.6.0
        with:
          python-version: "3.10"
      - name: Create venv
        run: python3 -m venv .venv
      - name: Build wheels for python
        uses: chainguard-actions/PyO3-maturin-action@23815a064f2267de38d5031b668fde459a80a7e5 # v1.51.0
        with:
          command: develop
          sccache: "false"
          working-directory: baseten-performance-client/python_bindings
      - name: Try import baseten-performance-client-maturin-publish
        run: |
          source .venv/bin/activate
          python -c "import baseten_performance_client; print(baseten_performance_client.__version__)"
      - name: test integration with fastapi server
        run: |
          source .venv/bin/activate
          pip install fastapi uvicorn anyio pytest
          python ./tests/integration_fastapi_server.py
          export BASETEN_API_KEY="wrong"
          python -m pytest tests


      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools libssl-dev libatomic-ops-dev

      - name: Install Rust with musl target
        uses: chainguard-actions/actions-rs-toolchain@373f2110a0bcee6b9753eed8510b849bfc55d020 # v1.0.7
        with:
          toolchain: stable
          override: true
          components: rust-src
          working-directory: baseten-performance-client

      - name: Rust tests
        run: |
          cd .. # outside the python bindings
          cargo test --release

      - name: Test reverse proxy
        run: |
          cd .. # outside the python bindings
          # Build reverse proxy
          cargo build --release --package baseten-performance-reverse-proxy

          # Run unit tests
          cargo test --package baseten-performance-reverse-proxy

          # Run integration tests
          cargo test --package baseten-performance-reverse-proxy --test integration_test
